<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcPulse - Circle AppKit Browser Wallet Send</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 440px;
      border: 1px solid #334155;
    }
    h2 { margin-top: 0; color: #38bdf8; }
    input, button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }
    button {
      background: #0284c7;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    .status { margin-top: 1rem; font-size: 0.9rem; color: #94a3b8; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🚀 ArcPulse Send (Circle AppKit)</h2>
    <p>Send USDC directly via Web3 Browser Wallet on Arc Testnet</p>

    <label for="recipient">Recipient Address</label>
    <input type="text" id="recipient" placeholder="0x..." value="0xe45f8f8b39414578b871ed196edcba9d2822a432">

    <label for="amount">Amount (USDC)</label>
    <input type="number" id="amount" placeholder="1.00" value="1.00">

    <button id="sendBtn">Send USDC via AppKit</button>

    <div class="status" id="statusLog">Status: Ready to send on Arc Testnet</div>
  </div>

  <script type="module" src="/main.ts"></script>
</body>
</html>
